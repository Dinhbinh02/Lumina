<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="../../lib/vendor/katex/katex.min.css">
  <script src="../../lib/vendor/katex/katex.min.js"></script>
  <script src="../../lib/vendor/katex/auto-render.min.js"></script>
  <style id="theme-style">
    :root {
      font-size: 14px;
      --bg-color: #0d0d0d;
      --text-color: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.65);
      --text-tertiary: rgba(255, 255, 255, 0.45);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-input: rgba(255, 255, 255, 0.12);
      --card-bg: #0d0d0d;
      --card-sub-bg: #18181b;
      --input-bg: #18181b;
      --accent-color: #10b981;
      --accent-cyan: #38bdf8;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'Google Sans Code', ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, monospace;

      --text-xs: 0.75em;
      --text-sm: 0.875em;
      --text-base: 1em;
      --text-md: 1.125em;
      --text-lg: 1.25em;
      --text-xl: 1.5em;
      --text-2xl: 2em;
      --text-3xl: 2.25em;
      --text-4xl: 2.75em;

      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      background-color: transparent !important;
      min-height: 100%;
    }

    body {
      font-family: var(--font-sans);
      background-color: transparent !important;
      color: var(--text-color);
      padding: 24px 16px;
      line-height: 1.5;
      font-size: var(--text-base);
      font-weight: var(--font-weight-regular);
      overflow-x: hidden;
      overflow-y: auto;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #sandbox-root {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 100%;
      margin: auto;
    }

    input, select, button, textarea {
      font-family: inherit;
      font-size: var(--text-base);
    }

    input[type="range"] {
      cursor: pointer;
      accent-color: var(--accent-color);
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
    }

    /* Core Button Styles */
    button, .nexus-btn {
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-color);
      padding: 0.5em 1.1em;
      border-radius: 8px;
      font-size: var(--text-sm);
      font-weight: var(--font-weight-medium);
      transition: all 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
    }

    button:hover, .nexus-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }

    button:active, .nexus-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .nexus-btn-primary {
      background: #ffffff !important;
      color: #000000 !important;
      border: none !important;
      font-weight: var(--font-weight-bold) !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .nexus-btn-primary:hover {
      background: #f0f0f0 !important;
      transform: translateY(-1px);
    }

    .nexus-btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-color);
    }

    /* Nexus Card & Layout System */
    .nexus-card, .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 16px 20px;
      margin: 0 auto 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      box-sizing: border-box;
      max-width: 480px;
      user-select: none;
    }

    .nexus-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .nexus-title-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: var(--text-xs);
      font-weight: var(--font-weight-semibold);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .nexus-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.4);
      flex-shrink: 0;
    }

    .nexus-status-dot.is-cyan {
      background: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4);
    }

    .nexus-status-dot.is-amber {
      background: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.4);
    }

    .nexus-badge {
      font-size: var(--text-xs);
      font-weight: var(--font-weight-semibold);
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 8px;
      border-radius: 20px;
      font-family: var(--font-mono);
      white-space: nowrap;
    }

    /* Hero Display Values */
    .nexus-hero-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .nexus-hero-label {
      font-size: var(--text-xs);
      font-weight: var(--font-weight-semibold);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .nexus-hero-val {
      font-size: var(--text-3xl);
      font-weight: var(--font-weight-bold);
      font-variant-numeric: tabular-nums;
      font-family: var(--font-sans);
      color: var(--text-color);
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-top: 2px;
    }

    /* Input Fields */
    .nexus-input-box, input[type="text"], input[type="number"] {
      background: var(--input-bg);
      border: 1px solid var(--border-color-input);
      border-radius: 8px;
      height: 38px;
      padding: 0 10px;
      color: var(--text-color);
      font-size: var(--text-base);
      font-weight: var(--font-weight-medium);
      outline: none;
      transition: border-color 0.15s ease;
      width: 100%;
      box-sizing: border-box;
    }

    .nexus-input-box:focus, input[type="text"]:focus, input[type="number"]:focus {
      border-color: rgba(255, 255, 255, 0.35);
    }

    /* Segmented Controls / Tabs */
    .nexus-segmented-control {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.04);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 12px;
    }

    .nexus-segmented-tab {
      flex: 1;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: var(--text-xs);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nexus-segmented-tab:hover {
      color: var(--text-color);
    }

    .nexus-segmented-tab.is-active {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    /* Stat Grid & Summary */
    .grid, .nexus-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color);
    }

    .stat-box, .nexus-stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: var(--text-base);
      font-weight: var(--font-weight-bold);
      font-variant-numeric: tabular-nums;
      color: var(--text-color);
    }

    canvas {
      display: block;
      max-width: 100%;
    }
  </style>
</head>

<body>
  <div id="sandbox-root"></div>
  <script>
    function notifyHeight() {
      const root = document.getElementById('sandbox-root');
      if (!root) return;
      const computed = window.getComputedStyle(document.body);
      const padTop = parseFloat(computed.paddingTop) || 12;
      const padBottom = parseFloat(computed.paddingBottom) || 12;
      const contentHeight = Math.ceil(root.getBoundingClientRect().height);
      const fullHeight = Math.ceil(contentHeight + padTop + padBottom);
      if (fullHeight > 40) {
        window.parent.postMessage({ type: 'NEXUS_WIDGET_RESIZE', height: fullHeight }, '*');
      }
    }

    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => {
        notifyHeight();
      });
      document.addEventListener('DOMContentLoaded', () => {
        const root = document.getElementById('sandbox-root');
        if (root) ro.observe(root);
      });
    }

    let currentRenderedCode = null;

    function applyThemeTokens(isDark, fontSize) {
      if (fontSize) {
        const fsStr = String(fontSize).trim();
        document.documentElement.style.fontSize = fsStr.endsWith('px') ? fsStr : `${fsStr}px`;
      }

      const bg = isDark ? '#1e1e24' : '#ffffff';
      const text = isDark ? '#f1f6fe' : '#1f1f1f';
      const textSec = isDark ? 'rgba(241, 246, 254, 0.65)' : 'rgba(31, 31, 31, 0.65)';
      const border = isDark ? 'rgba(255, 255, 255, 0.12)' : 'rgba(0, 0, 0, 0.08)';
      const cardBg = isDark ? '#26282d' : '#f8fafc';
      const cardSubBg = isDark ? '#1e1e24' : '#f1f5f9';
      const accent = isDark ? '#f1f6fe' : '#1f1f1f';

      document.documentElement.style.setProperty('--bg-color', bg);
      document.documentElement.style.setProperty('--text-color', text);
      document.documentElement.style.setProperty('--text-secondary', textSec);
      document.documentElement.style.setProperty('--border-color', border);
      document.documentElement.style.setProperty('--card-bg', cardBg);
      document.documentElement.style.setProperty('--card-sub-bg', cardSubBg);
      document.documentElement.style.setProperty('--accent-color', accent);
      document.body.style.color = text;
    }

    async function renderContent(rawCode, isDark, fontSize) {
      if (!rawCode) return;
      applyThemeTokens(isDark, fontSize);

      // Guard: if same code already executed, do not re-run scripts
      if (currentRenderedCode === rawCode) {
        return;
      }
      currentRenderedCode = rawCode;

      const container = document.getElementById('sandbox-root');
      container.innerHTML = rawCode;

      if (typeof window.renderMathInElement === 'function') {
        try {
          window.renderMathInElement(container, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'canvas'],
            throwOnError: false
          });
        } catch (e) {
          console.warn('[Sandbox] KaTeX render error:', e);
        }
      }

      // Re-insert scripts sequentially (waiting for external scripts with src to load first)
      const scripts = Array.from(container.querySelectorAll('script'));
      for (const oldScript of scripts) {
        await new Promise((resolve) => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          
          if (oldScript.src) {
            newScript.onload = () => {
              notifyHeight();
              resolve();
            };
            newScript.onerror = () => {
              console.warn("External script failed to load:", oldScript.src);
              resolve();
            };
            oldScript.parentNode.replaceChild(newScript, oldScript);
          } else {
            newScript.textContent = oldScript.textContent;
            oldScript.parentNode.replaceChild(newScript, oldScript);
            resolve();
          }
        });
      }

      setTimeout(notifyHeight, 30);
      setTimeout(notifyHeight, 120);
      setTimeout(notifyHeight, 300);
    }

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'NEXUS_WIDGET_RENDER') {
        renderContent(event.data.code, event.data.isDark, event.data.fontSize);
      } else if (event.data && event.data.type === 'NEXUS_WIDGET_THEME_UPDATE') {
        applyThemeTokens(event.data.isDark, event.data.fontSize);
        setTimeout(notifyHeight, 50);
      }
    });

    if (typeof ResizeObserver !== 'undefined') {
      const ro = new ResizeObserver(() => notifyHeight());
      ro.observe(document.body);
    }

    // Notify parent iframe container that sandbox is ready
    window.parent.postMessage({ type: 'NEXUS_WIDGET_READY' }, '*');
    setTimeout(notifyHeight, 50);
  </script>
</body>

</html>
